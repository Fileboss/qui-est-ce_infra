services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KC_ADMIN_BASIC_AUTH_HASH: ${KC_ADMIN_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
      - back
      - keycloak
      - minio

  front:
    image: ghcr.io/fileboss/qui-est-ce-front:latest
    restart: unless-stopped
    pull_policy: always

  back:
    image: ghcr.io/fileboss/qui-est-ce-back:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      QUARKUS_PROFILE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: https://s3.qui-est-qui.lepgu.fr
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      OIDC_AUTH_SERVER_URL: https://auth.qui-est-qui.lepgu.fr/realms/qui-est-ce
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KEYCLOAK_ADMIN_SECRET: ${KEYCLOAK_ADMIN_SECRET}
      KEYCLOAK_URL: http://keycloak:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # Not --optimized: KC_DB and KC_HEALTH_ENABLED are build-time options that
    # need kc.sh build to persist. Without that pre-build pass --optimized
    # refuses to apply them and the container crash-loops. Letting Keycloak
    # build at every startup costs ~10s; revisit with a custom pre-built image
    # if we ever need faster cold starts.
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.qui-est-qui.lepgu.fr
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Substituted into realm-export-prod.json at import time (${VAR} placeholders).
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KEYCLOAK_ADMIN_SECRET: ${KEYCLOAK_ADMIN_SECRET}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export-prod.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # HTTP/1.0 (not /1.1): defaults to Connection: close, so Keycloak flushes
      # the response and closes the socket. /1.1 keeps the connection alive and
      # cat blocks past the 5s timeout, even though the response was sent.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # On first volume init, the postgres image creates POSTGRES_DB (the app DB,
  # owned by POSTGRES_USER as superuser) automatically. The init script in
  # /docker-entrypoint-initdb.d/ creates the second DB (keycloak) and its role.
  # Healthcheck queries the keycloak DB so it only goes green once the init
  # script has finished — this prevents Keycloak from racing the init phase.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${DB_USERNAME} -d keycloak -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" \
          && mc mb --ignore-existing local/game-images \
          && mc anonymous set download local/game-images

volumes:
  postgres_data:
  minio_data:
  keycloak_data:
  caddy_data:
  caddy_config:
