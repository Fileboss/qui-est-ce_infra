# À installer sur le VPS : /etc/ssh/sshd_config.d/50-vwbackup.conf
# L'utilisateur vwbackup ne peut faire que du SFTP, enfermé dans son dossier.
# (La restriction par IP source se fait via `from="100.64.0.0/10"` dans sa clé autorisée.)
Match User vwbackup
    ChrootDirectory /srv/backups/vwbackup
    ForceCommand internal-sftp
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
