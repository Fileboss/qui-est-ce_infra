# Stack du HP EliteDesk (maison) : Immich + Vaultwarden.
# Aucun port n'est publié sur le LAN : tout est lié à 127.0.0.1 et c'est
# `tailscale serve` qui l'expose sur le tailnet uniquement (voir docs/homelab-setup.md).
# Base Immich : https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# (images épinglées par digest comme dans la release officielle ; à resynchroniser
# avec la release lors des montées de version majeure).

name: homelab

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    # Plafond CPU (miniatures, métadonnées, ffmpeg) : le HP reste réactif pendant les imports.
    cpus: ${IMMICH_SERVER_CPUS:-3}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    # Plafond CPU du ML (visages, recherche) : le plus gourmand pendant un import.
    cpus: ${IMMICH_ML_CPUS:-2}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
    security_opt:
      - no-new-privileges:true

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false

  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:${VAULTWARDEN_VERSION}
    restart: always
    # Non-root + port > 1024 : pas besoin de capabilities, on les retire toutes.
    # /!\ le dossier de données doit appartenir à ce uid:gid (cf. procédure).
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${VW_DOMAIN}
      ROCKET_PORT: 8080
      # Ouvert uniquement le temps de créer les 2 comptes, puis passer à false.
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED:-false}
      # Les invitations (organisation partagée) restent possibles : seuls les
      # admins d'une organisation, donc vous deux, peuvent inviter.
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"
      # Panneau /admin désactivé (pas d'ADMIN_TOKEN) : surface d'attaque en moins.
      # Caddy (VPS) transmet l'IP réelle du client dans X-Real-IP.
      IP_HEADER: X-Real-IP
      LOG_LEVEL: warn
      EXTENDED_LOGGING: "true"
    volumes:
      - ${VW_DATA_LOCATION}:/data
    ports:
      - '127.0.0.1:8222:8080'

volumes:
  model-cache:
