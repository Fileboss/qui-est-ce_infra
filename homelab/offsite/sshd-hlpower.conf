# À installer sur le PC hors site : /etc/ssh/sshd_config.d/50-hlpower.conf (§18.5)
# Le compte hlpower (clé SSH du HP) ne peut qu'éteindre le PC : commande forcée, pas de terminal ni de tunnel.
# (La restriction par IP source se fait via `from="100.64.0.0/10"` dans sa clé autorisée.)
Match User hlpower
    ForceCommand /usr/local/sbin/offsite-poweroff
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
